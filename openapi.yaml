openapi: 3.0.0
info:
  title: Truevoice Biometrics API
  version: "1.0.0"
  description: |
    TrueVoice is a biometric voice authentication API for secure user identity verification across Web, App, IVR, mobile banking, POS, ATM, USSD, and digital banking systems.

servers:
  - url: https://api.truevoice.com.ng/v1
    description: Production server

paths:

  /companies/signup:
    post:
      summary: Company Signup
      description: Register a company and receive API keys for authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Example Bank
      responses:
        "200":
          description: Successful signup
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: COMPANY_12345
                  name:
                    type: string
                    example: Example Bank
                  api_key:
                    type: string
                    example: TV-API-KEY-234234234234
                  api_secret:
                    type: string
                    example: TV-API-SECRET-j2h3g2389gteg3sgs

  /token:
    post:
      summary: Get Access Token
      description: Generate an access token using company credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: string
                  example: COMPANY_12345
                user_id:
                  type: string
                  example: USER_98765
                lang:
                  type: string
                  example: en
      responses:
        "200":
          description: Successful token generation

  /token/refresh:
    post:
      summary: Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token refreshed successfully

  /token/revoke:
    post:
      summary: Revoke Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token revoked successfully

  /health:
    get:
      summary: Health Check
      responses:
        "200":
          description: API is running

  /languages:
    get:
      summary: Supported Languages
      responses:
        "200":
          description: Returns supported language list

  /challenge:
    get:
      summary: Get Voice Challenge
      description: Fetch a phrase challenge for enrollment or verification.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Challenge returned successfully

  /enroll-voice:
    post:
      summary: Enroll User Voiceprint
      description: Upload a voice sample for biometric enrollment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        "200":
          description: Voice enrolled successfully

  /secure-verify-voice:
    post:
      summary: Verify Voice for Secure Action
      description: Upload a voice sample for transaction verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        "200":
          description: Voice verification result

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
