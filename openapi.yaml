openapi: 3.0.0
info:
  title: My FastAPI Collection
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/enroll-voice:
    post:
      summary: Enroll a new voice sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                voice_sample:
                  type: string
                  format: binary
              required:
                - user_id
                - voice_sample
      responses:
        "200":
          description: Voice enrolled successfully
  /api/challenge:
    get:
      summary: Get a challenge phrase for verification
      responses:
        "200":
          description: Challenge retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/token:
    post:
      summary: Generate authentication token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
  /api/secure-verify-voice:
    post:
      summary: Securely verify a voice sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                voice_sample:
                  type: string
                  format: binary
                challenge_response:
                  type: string
              required:
                - user_id
                - voice_sample
      responses:
        "200":
          description: Voice verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  confidence_score:
                    type: number
                    format: float
