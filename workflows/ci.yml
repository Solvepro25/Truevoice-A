# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pretrained models
        uses: actions/cache@v3
        with:
          path: pretrained_models
          key: ${{ runner.os }}-speechbrain-models
          restore-keys: |
            ${{ runner.os }}-speechbrain-models

      - name: Pre-download SpeechBrain models
        run: |
          python - <<'PYCODE'
          from speechbrain.pretrained import EncoderClassifier, SpectralMaskEnhancement

          EncoderClassifier.from_hparams(
              source="speechbrain/spkrec-ecapa-voxceleb",
              savedir="pretrained_models/ecapa"
          )
          SpectralMaskEnhancement.from_hparams(
              source="speechbrain/mtl-mimic-voicebank",
              savedir="pretrained_models/denoiser"
          )
          PYCODE

      - name: Run pytest
        run: |
          pytest -v --disable-warnings

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image
        run: |
          docker build -t truevoice:test .

      - name: Run container sanity check
        run: |
          docker run --rm -d -p 8000:8000 --name truevoice_test truevoice:test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs truevoice_test && exit 1)
          docker stop truevoice_test
